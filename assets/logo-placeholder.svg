  <!-- Main Text - Reduced size from 48 to 42 -->
  <text x="100" y="95" text-anchor="middle" fill="#333333" font-family="Arial, sans-serif" font-size="42" font-weight="900" letter-spacing="-1">GREGHI</text>
  
  <!-- Subtitle - Reduced size from 12 to 10 -->
